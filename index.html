<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Year Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background-color: #1e293b;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #cbd5e1;
            font-size: 1rem;
        }
        .image-container {
            width: 100%;
            max-height: 48vh;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            background-color: #0f172a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            cursor: zoom-in;
            position: relative;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.25s ease;
        }
        .image-container:hover img {
            transform: scale(1.02);
        }
        
        /* Modal Lightbox for Enlarged Image */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            cursor: zoom-out;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal.active {
            display: flex;
            opacity: 1;
        }
        .modal img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
        }

        .slider-container {
            margin: 25px 0;
            position: relative;
        }
        .year-label {
            font-size: 2rem;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 10px;
        }
        input[type=range] {
            width: 100%;
            margin: 15px 0;
            -webkit-appearance: none;
            background: #334155;
            height: 8px;
            border-radius: 4px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            transition: background 0.15s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            background: #0ea5e9;
        }
        .scale-labels {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 0.9rem;
            padding: 0 5px;
        }
        button {
            background-color: #059669;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #047857;
        }
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            display: none;
        }
        .feedback.correct { background-color: #064e3b; color: #a7f3d0; }
        .feedback.close { background-color: #78350f; color: #fde68a; }
        .feedback.wrong { background-color: #7f1d1d; color: #fecaca; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="stats-bar">
        <div id="score-display">Összpontszám: 0</div>
        <div id="round-display">Forduló: 1/10</div>
    </div>

    <div class="image-container" id="image-box" onclick="toggleModal(true)">
        <img id="game-image" src="" alt="Historical Scene">
    </div>

    <div class="slider-container">
        <div class="year-label" id="year-val">2000</div>
        <input type="range" id="year-slider" min="1990" max="2025" value="2000">
        <div class="scale-labels">
            <span>1990</span>
            <span>2000</span>
            <span>2025</span>
        </div>
    </div>

    <button id="action-btn" onclick="submitGuess()">Tippelek</button>
    <div id="feedback" class="feedback"></div>
</div>

<!-- Fullscreen Modal Lightbox -->
<div class="modal" id="image-modal" onclick="toggleModal(false)">
    <img id="modal-image" src="" alt="Enlarged Historical Scene">
</div>

<script>
    let masterImageList = [];
    let gameData = [];
    let currentRound = 0;
    let totalScore = 0;
    let isFlipped = false;

    const slider = document.getElementById('year-slider');
    const yearVal = document.getElementById('year-val');
    const image = document.getElementById('game-image');
    const modalImage = document.getElementById('modal-image');
    const modal = document.getElementById('image-modal');
    const actionBtn = document.getElementById('action-btn');
    const feedback = document.getElementById('feedback');
    const scoreDisplay = document.getElementById('score-display');
    const roundDisplay = document.getElementById('round-display');
    const imageContainer = document.querySelector('.image-container');
    const sliderContainer = document.querySelector('.slider-container');

    // Update live year label when dragging slider
    slider.addEventListener('input', () => {
        yearVal.innerText = slider.value;
    });

    // Toggle fullscreen image modal
    function toggleModal(open) {
        if (open && image.src) {
            modalImage.src = image.src;
            modal.classList.add('active');
        } else {
            modal.classList.remove('active');
        }
    }

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') toggleModal(false);
    });

    // Load data from images.json once on page startup
    async function initGame() {
        try {
            const response = await fetch('images.json');
            if (!response.ok) throw new Error("Could not load images.json");
            masterImageList = await response.json();
            
            if (masterImageList.length === 0) {
                alert("No images found in images.json!");
                return;
            }

            startNewSession();
        } catch (error) {
            console.error(error);
            feedback.className = "feedback wrong";
            feedback.innerHTML = `⚠️ Nem sikerült betölteni az images.json fájlt. A játék nem indítható.`;
            feedback.style.display = 'block';
        }
    }

    // Set up a new 10-image playthrough set
    function startNewSession() {
        // Shuffle master list and pick up to 10 images
        gameData = [...masterImageList].sort(() => 0.5 - Math.random()).slice(0, 10);
        currentRound = 0;
        totalScore = 0;
        
        // Restore layout elements when restarting after Game Over screen
        imageContainer.style.display = 'flex';
        sliderContainer.style.display = 'block';
        roundDisplay.style.display = 'block';

        scoreDisplay.innerText = `Összpontszám: ${totalScore}`;
        initRound();
    }

    function initRound() {
        isFlipped = false;
        feedback.style.display = 'none';
        slider.disabled = false;
        slider.value = 2000;
        yearVal.innerText = 2000;
        
        roundDisplay.innerText = `Forduló: ${currentRound + 1}/${gameData.length}`;
        image.src = gameData[currentRound].url;
        actionBtn.innerText = "Tippelek";
        actionBtn.style.backgroundColor = "#059669";
        actionBtn.setAttribute('onclick', 'submitGuess()');
    }

    function submitGuess() {
        if (isFlipped) {
            currentRound++;
            if (currentRound < gameData.length) {
                initRound();
            } else {
                // Game Over Screen
                imageContainer.style.display = 'none';
                sliderContainer.style.display = 'none';
                roundDisplay.style.display = 'none';
                
                feedback.className = "feedback correct";
                feedback.style.display = "block";
                feedback.innerHTML = `🎉 A játék véget ért! Pontszámod: ${totalScore} / ${gameData.length * 100}`;
                
                actionBtn.innerText = "Új játék";
                actionBtn.style.backgroundColor = "#2563eb";
                actionBtn.setAttribute('onclick', 'startNewSession()');
            }
            return;
        }

        const guess = parseInt(slider.value);
        const actual = gameData[currentRound].year;
        const difference = Math.abs(guess - actual);
        let roundScore = 0;

        slider.disabled = true;
        isFlipped = true;

        if (difference === 0) {
            roundScore = 100;
            feedback.className = "feedback correct";
            feedback.innerHTML = `🌟 Szép munka! A helyes évszám ${actual}. (+100 pont)`;
        } else if (difference <= 3) {
            roundScore = 100 - (difference * 25);
            feedback.className = "feedback close";
            feedback.innerHTML = `🎯 Közel volt! Valójában ${actual} (te pedig ${guess}-t tippeltél). (+${roundScore} pont)`;
        } else {
            roundScore = 0;
            feedback.className = "feedback wrong";
            feedback.innerHTML = `❌ Nem sikerült! Valójában ${actual} (te viszont ${guess}-t tippeltél). (+0 pont)`;
        }

        totalScore += roundScore;
        scoreDisplay.innerText = `Összpontszám: ${totalScore}`;
        feedback.style.display = 'block';
        
        actionBtn.innerText = "Következő kör";
        actionBtn.style.backgroundColor = "#2563eb";
    }

    // Initialize game on page load
    initGame();
</script>

</body>
</html>
